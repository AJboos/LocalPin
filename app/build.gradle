plugins { id 'com.android.application' }
android {
    namespace 'local.pin'
    compileSdk 36
    defaultConfig {
        applicationId 'local.pin'
        minSdk 31
        targetSdk 36
        versionCode 7
        versionName '2.2.1-preview'
        manifestPlaceholders = [appLabel: '点位']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            manifestPlaceholders = [appLabel: '点位·运动预览']
        }
        release { minifyEnabled false }
    }
}
// No third-party runtime libraries, analytics, ad SDKs or JavaScript.
